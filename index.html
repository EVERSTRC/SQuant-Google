<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTC Economic Impact Radar - MQL5 Style</title>
  <style>
    :root {
      --bg-color: #0e1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-main: #c9d1d9;
      --bullish: #2ea043;
      --bearish: #f85149;
      --neutral: #8b949e;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 24px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
      margin-bottom: 24px;
    }

    h1 { margin: 0; font-size: 1.5rem; }
    .badge-live {
      background-color: rgba(46, 160, 67, 0.15);
      color: var(--bullish);
      border: 1px solid var(--bullish);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px 20px;
      display: grid;
      grid-template-columns: 120px 1fr 140px 140px 160px;
      align-items: center;
      gap: 12px;
    }

    .card-header {
      font-weight: bold;
      color: var(--neutral);
      font-size: 0.85rem;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
      background-color: transparent;
    }

    .time { font-family: monospace; color: var(--neutral); }
    .event-title { font-weight: 600; }
    
    .val-box {
      font-size: 0.9rem;
    }
    .val-box span {
      display: block;
      font-size: 0.75rem;
      color: var(--neutral);
    }

    .signal {
      padding: 8px 12px;
      border-radius: 6px;
      text-align: center;
      font-weight: bold;
      font-size: 0.9rem;
    }
    .signal.bullish { background-color: rgba(46, 160, 67, 0.2); color: var(--bullish); border: 1px solid var(--bullish); }
    .signal.bearish { background-color: rgba(248, 81, 73, 0.2); color: var(--bearish); border: 1px solid var(--bearish); }
    .signal.neutral { background-color: rgba(139, 148, 158, 0.2); color: var(--neutral); border: 1px solid var(--neutral); }

    .btn-refresh {
      background-color: #238636;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-refresh:hover { background-color: #2ea043; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>BTC News Impact Radar (MQL5 Engine)</h1>
        <small style="color: var(--neutral);">Monitor de impacto macroeconómico en tiempo real para Bitcoin</small>
      </div>
      <div>
        <span class="badge-live">● TIEMPO REAL</span>
        <button class="btn-refresh" onclick="fetchCalendarEvents()">Simular Actualización</button>
      </div>
    </header>

    <div class="grid">
      <!-- Encabezados de tabla -->
      <div class="card card-header">
        <div>Hora (UTC)</div>
        <div>Evento Económico</div>
        <div>Pronóstico</div>
        <div>Dato Actual</div>
        <div>Impacto BTC</div>
      </div>

      <!-- Contenedor dinámico de eventos -->
      <div id="events-list" class="grid"></div>
    </div>
  </div>

  <script>
    // Eventos macroeconómicos clave de EE.UU. que impactan a Bitcoin
    const monitoredEvents = [
      { id: "CPI", name: "US CPI (YoY) - Inflación", inverseRatio: true },
      { id: "FED_RATE", name: "Fed Interest Rate Decision", inverseRatio: true },
      { id: "NFP", name: "Non-Farm Payrolls", inverseRatio: true },
      { id: "GDP", name: "US GDP (QoQ) - Crecimiento", inverseRatio: false }
    ];

    // Datos simulados (Reemplazar la llamada HTTP a tu servidor backend/proxy MQL5)
    async function fetchCalendarEvents() {
      const mockApiData = [
        {
          id: "CPI",
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          name: "US CPI (YoY)",
          currency: "USD",
          forecast: 2.8,
          actual: 3.1, // Inflación mayor a la esperada
          unit: "%"
        },
        {
          id: "FED_RATE",
          time: new Date(Date.now() + 3600000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          name: "Fed Interest Rate Decision",
          currency: "USD",
          forecast: 5.25,
          actual: 5.00, // Recorte de tipos (menor al esperado)
          unit: "%"
        },
        {
          id: "NFP",
          time: new Date(Date.now() + 7200000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          name: "Non-Farm Payrolls",
          currency: "USD",
          forecast: 180,
          actual: 140, // Empleo débil
          unit: "K"
        }
      ];

      renderEvents(mockApiData);
    }

    // Lógica de evaluación del impacto en Bitcoin
    function calculateBtcImpact(event) {
      if (event.actual === null || event.actual === undefined) {
        return { text: "PENDIENTE", class: "neutral" };
      }

      const monitored = monitoredEvents.find(m => m.id === event.id) || { inverseRatio: true };
      const diff = event.actual - event.forecast;

      if (Math.abs(diff) < 0.01) {
        return { text: "NEUTRAL ➔", class: "neutral" };
      }

      // Si el indicador favorece al USD y la relación es inversa (Ej: Inflación alta -> USD fuerte -> BTC baja)
      if (monitored.inverseRatio) {
        if (diff > 0) {
          return { text: "BAJAR 📉 (Bearish)", class: "bearish" };
        } else {
          return { text: "SUBIR 📈 (Bullish)", class: "bullish" };
        }
      } else {
        // Relación directa
        if (diff > 0) {
          return { text: "SUBIR 📈 (Bullish)", class: "bullish" };
        } else {
          return { text: "BAJAR 📉 (Bearish)", class: "bearish" };
        }
      }
    }

    function renderEvents(events) {
      const container = document.getElementById("events-list");
      container.innerHTML = "";

      events.forEach(evt => {
        const impact = calculateBtcImpact(evt);
        
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="time">${evt.time}</div>
          <div class="event-title">${evt.name} (${evt.currency})</div>
          <div class="val-box"><span>Forecast</span>${evt.forecast}${evt.unit}</div>
          <div class="val-box"><span>Actual</span><strong>${evt.actual !== null ? evt.actual + evt.unit : '--'}</strong></div>
          <div class="signal ${impact.class}">${impact.text}</div>
        `;
        container.appendChild(card);
      });
    }

    // Inicializar app
    fetchCalendarEvents();

    // Actualización automática cada 10 segundos
    setInterval(fetchCalendarEvents, 10000);
  </script>
</body>
</html>
