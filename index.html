<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MQL5 Live Cluster Radar — Real-Time BTC Engine</title>
  <style>
    :root {
      --bg-primary: #0b0e14;
      --bg-secondary: #151922;
      --bg-card: #1c212d;
      --border-color: #2a3142;
      --text-main: #e1e7ed;
      --text-muted: #8b98a5;
      --accent-blue: #2962ff;
      --accent-green: #00e676;
      --accent-red: #ff5252;
      --accent-amber: #ffab00;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-primary); color: var(--text-main); padding: 20px; }
    .container { max-width: 1100px; margin: 0 auto; }

    header {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon { width: 40px; height: 40px; background: rgba(41, 98, 255, 0.15); border: 1px solid var(--accent-blue); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--accent-blue); font-weight: bold; }

    .btc-ticker {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background-color 0.3s;
    }
    .btc-ticker.flash-up { background-color: rgba(0, 230, 118, 0.25); }
    .btc-ticker.flash-down { background-color: rgba(255, 82, 82, 0.25); }

    .price-value { font-family: var(--font-mono); font-size: 1.2rem; font-weight: 700; }
    .badge-status { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; padding: 4px 10px; border-radius: 20px; font-weight: 600; background: rgba(0, 230, 118, 0.1); color: var(--accent-green); border: 1px solid var(--accent-green); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

    .cluster-box { background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px; margin-bottom: 20px; overflow: hidden; }
    .cluster-header { background-color: var(--bg-card); padding: 12px 20px; display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-color); font-size: 0.85rem; color: var(--text-muted); }
    .news-item { padding: 14px 20px; border-bottom: 1px solid var(--border-color); display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; align-items: center; gap: 12px; }
    .val-field span { display: block; font-size: 0.75rem; color: var(--text-muted); }
    .val-field strong { font-family: var(--font-mono); }

    .ai-banner { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; background: rgba(41, 98, 255, 0.05); }
    .signal-pill { font-family: var(--font-mono); font-size: 1rem; font-weight: 700; padding: 6px 14px; border-radius: 6px; text-transform: uppercase; }
    .signal-pill.bullish { background: rgba(0, 230, 118, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
    .signal-pill.bearish { background: rgba(255, 82, 82, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }
    .signal-pill.neutral { background: rgba(255, 171, 0, 0.2); color: var(--accent-amber); border: 1px solid var(--accent-amber); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-icon">MQL5</div>
        <div>
          <h2 style="font-size: 1.1rem;">BTC Live Cluster Radar</h2>
          <span style="font-size: 0.8rem; color: var(--text-muted);">Monitoreo y Análisis de Bloque Macro en Tiempo Real</span>
        </div>
      </div>

      <div class="btc-ticker" id="btc-ticker">
        <div>
          <span style="font-size: 0.75rem; color: var(--text-muted); display: block;">BTC/USD (Binance Live)</span>
          <span class="price-value" id="btc-price">Conectando...</span>
        </div>
        <span id="btc-change" style="font-size: 0.85rem; font-weight: bold;">--</span>
      </div>

      <div class="badge-status">
        <div class="dot"></div>
        <span id="connection-status">WEBSOCKET ACTIVO</span>
      </div>
    </header>

    <div id="clusters-container"></div>
  </div>

  <script>
    let lastPrice = 0;

    // 1. CONEXIÓN EN TIEMPO REAL AL PRECIO DE BTC (WEBSOCKET DE BINANCE)
    function initLiveBtcStream() {
      const priceEl = document.getElementById('btc-price');
      const changeEl = document.getElementById('btc-change');
      const tickerBox = document.getElementById('btc-ticker');
      const statusEl = document.getElementById('connection-status');

      const ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@ticker');

      ws.onopen = () => { statusEl.textContent = "CONECTADO A PRECIO EN VIVO"; };
      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        const currentPrice = parseFloat(data.c);
        const priceChangePercent = parseFloat(data.P);

        priceEl.textContent = currentPrice.toLocaleString('en-US', { style: 'currency', currency: 'USD' });
        changeEl.textContent = `${priceChangePercent >= 0 ? '+' : ''}${priceChangePercent.toFixed(2)}%`;
        changeEl.style.color = priceChangePercent >= 0 ? 'var(--accent-green)' : 'var(--accent-red)';

        if (lastPrice !== 0) {
          if (currentPrice > lastPrice) {
            tickerBox.classList.add('flash-up');
            setTimeout(() => tickerBox.classList.remove('flash-up'), 300);
          } else if (currentPrice < lastPrice) {
            tickerBox.classList.add('flash-down');
            setTimeout(() => tickerBox.classList.remove('flash-down'), 300);
          }
        }
        lastPrice = currentPrice;
      };

      ws.onerror = () => { statusEl.textContent = "ERROR CONEXIÓN PRECIO"; };
    }

    // 2. MOTOR DE ANÁLISIS MACROECONÓMICO PARA EL BLOQUE DE NOTICIAS
    function processNewsCluster(cluster) {
      let usdImpactScore = 0;

      cluster.events.forEach(evt => {
        const diff = evt.actual - evt.forecast;
        if (evt.id === 'CPI' || evt.id === 'PPI') usdImpactScore += diff * 2.5;
        if (evt.id === 'NFP') usdImpactScore += (diff / 50) * 1.5;
        if (evt.id === 'UNEMP') usdImpactScore -= diff * 2.0;
      });

      if (usdImpactScore > 0.15) {
        return {
          direction: "BAJAR 📉",
          biasClass: "bearish",
          confidence: "89%",
          explanation: "El bloque acumulado de datos favorece la fortaleza del dólar estadounidense (mayor inflación/empleo), impulsando a Bitcoin a la baja."
        };
      } else if (usdImpactScore < -0.15) {
        return {
          direction: "SUBIR 📈",
          biasClass: "bullish",
          confidence: "91%",
          explanation: "Los indicadores muestran desaceleración en EE.UU. (USD débil), aumentando el apetito por riesgo y empujando a BTC al alza."
        };
      } else {
        return {
          direction: "NEUTRAL ➔",
          biasClass: "neutral",
          confidence: "60%",
          explanation: "Fuerzas opuestas en los datos publicados. Se espera volatilidad en rango corto."
        };
      }
    }

    // 3. RENDERIZADO DEL CLUSTER DE NOTICIAS
    function renderClusterUI(cluster) {
      const container = document.getElementById('clusters-container');
      const result = processNewsCluster(cluster);

      const html = `
        <div class="cluster-box">
          <div class="cluster-header">
            <span>PUBLICACIÓN EN BLOQUE: ${cluster.time} UTC</span>
            <span>Cluster de Noticias (${cluster.events.length} Eventos Simultáneos)</span>
          </div>
          ${cluster.events.map(e => `
            <div class="news-item">
              <div><strong>🇺🇸 ${e.title}</strong></div>
              <div class="val-field"><span>Anterior</span><strong>${e.previous}${e.unit}</strong></div>
              <div class="val-field"><span>Pronóstico</span><strong>${e.forecast}${e.unit}</strong></div>
              <div class="val-field"><span>Actual</span><strong style="color: var(--accent-blue);">${e.actual}${e.unit}</strong></div>
            </div>
          `).join('')}
          <div class="ai-banner">
            <div>
              <span style="font-size: 0.75rem; color: var(--text-muted);">DIRECCIÓN PROYECTADA PARA BTC:</span>
              <p style="font-size: 0.85rem; margin-top: 4px;">${result.explanation}</p>
            </div>
            <div style="text-align: right;">
              <span class="signal-pill ${result.biasClass}">${result.direction}</span>
              <span style="display: block; font-size: 0.75rem; color: var(--text-muted); margin-top: 4px;">Confianza: ${result.confidence}</span>
            </div>
          </div>
        </div>
      `;
      container.innerHTML = html + container.innerHTML;
    }

    // Inicializar Stream de Precio
    initLiveBtcStream();

    // Ejemplo de recepción de cluster
    renderClusterUI({
      time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
      events: [
        { id: 'NFP', title: 'Non-Farm Payrolls', previous: 165, forecast: 175, actual: 215, unit: 'K' },
        { id: 'UNEMP', title: 'Unemployment Rate', previous: 4.1, forecast: 4.0, actual: 4.2, unit: '%' }
      ]
    });
  </script>
</body>
</html>
