<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MQL5 BTC Live Cluster Radar — Nivel de Impacto (Costa Rica)</title>
  <style>
    :root {
      --bg-primary: #0b0e14;
      --bg-secondary: #151922;
      --bg-card: #1c212d;
      --border-color: #2a3142;
      --text-main: #e1e7ed;
      --text-muted: #8b98a5;
      --accent-blue: #2962ff;
      --accent-green: #00e676;
      --accent-red: #ff5252;
      --accent-amber: #ffab00;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      padding: 16px;
    }

    .container { max-width: 1200px; margin: 0 auto; }

    header {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 40px; height: 40px;
      background: rgba(41, 98, 255, 0.15);
      border: 1px solid var(--accent-blue);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: var(--accent-blue); font-weight: bold; font-size: 1.2rem;
    }

    .btc-ticker {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background-color 0.3s;
    }
    .btc-ticker.flash-up { background-color: rgba(0, 230, 118, 0.25); }
    .btc-ticker.flash-down { background-color: rgba(255, 82, 82, 0.25); }

    .price-value { font-family: var(--font-mono); font-size: 1.2rem; font-weight: 700; }
    
    .badge-status {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.75rem; padding: 4px 10px;
      border-radius: 20px; font-weight: 600;
      background: rgba(0, 230, 118, 0.1);
      color: var(--accent-green);
      border: 1px solid var(--accent-green);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

    .controls-panel {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .api-status {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      background: var(--accent-blue);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }

    .cluster-box {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .cluster-header {
      background-color: var(--bg-card);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .news-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      display: grid;
      grid-template-columns: 2.2fr 0.8fr 1fr 1fr 1fr;
      align-items: center;
      gap: 8px;
    }

    .impact-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      display: inline-block;
      text-align: center;
      width: fit-content;
    }
    .impact-high { background: rgba(255, 82, 82, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }
    .impact-medium { background: rgba(255, 171, 0, 0.2); color: var(--accent-amber); border: 1px solid var(--accent-amber); }
    .impact-low { background: rgba(0, 230, 118, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }

    .val-field span { display: block; font-size: 0.7rem; color: var(--text-muted); }
    .val-field strong { font-family: var(--font-mono); font-size: 0.9rem; }

    .ai-banner {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(41, 98, 255, 0.05);
      gap: 12px;
    }

    .signal-pill {
      font-family: var(--font-mono);
      font-size: 1rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 6px;
      text-transform: uppercase;
      display: inline-block;
    }
    .signal-pill.bullish { background: rgba(0, 230, 118, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
    .signal-pill.bearish { background: rgba(255, 82, 82, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }
    .signal-pill.neutral { background: rgba(255, 171, 0, 0.2); color: var(--accent-amber); border: 1px solid var(--accent-amber); }

    .info-msg {
      background: var(--bg-secondary);
      border: 1px dashed var(--border-color);
      border-radius: 10px;
      padding: 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 16px;
    }

    @media (max-width: 768px) {
      .news-item { grid-template-columns: 1fr; gap: 6px; }
      .ai-banner { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-icon">⚡</div>
        <div>
          <h2 style="font-size: 1.05rem;">MQL5 BTC Live Cluster Radar</h2>
          <span style="font-size: 0.75rem; color: var(--text-muted);">Clasificación de Impacto — Hora Costa Rica (UTC-6)</span>
        </div>
      </div>

      <div class="btc-ticker" id="btc-ticker">
        <div>
          <span style="font-size: 0.7rem; color: var(--text-muted); display: block;">BTC/USD (Binance Feed)</span>
          <span class="price-value" id="btc-price">Conectando...</span>
        </div>
        <span id="btc-change" style="font-size: 0.85rem; font-weight: bold;">--</span>
      </div>

      <div class="badge-status">
        <div class="dot"></div>
        <span id="connection-status">SISTEMA ACTIVO</span>
      </div>
    </header>

    <div class="controls-panel">
      <div class="api-status">
        <span>🇨🇷 Zona Horaria:</span>
        <strong id="active-source-badge" style="color: var(--accent-green);">Costa Rica (America/Costa_Rica)</strong>
      </div>
      <div>
        <button onclick="fetchWeeklyCalendar()">🔄 Actualizar Calendario</button>
      </div>
    </div>

    <div id="status-message"></div>
    <div id="clusters-container"></div>
  </div>

  <script>
    const FMP_API_KEY = 'exL5USAvIGPpWF1HKYN6cL2pPU5Z550g';
    let lastPrice = 0;

    // 1. WEBSOCKET DE BINANCE PARA PRECIO BTC
    function initLiveBtcStream() {
      const priceEl = document.getElementById('btc-price');
      const changeEl = document.getElementById('btc-change');
      const tickerBox = document.getElementById('btc-ticker');
      const statusEl = document.getElementById('connection-status');

      const ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@ticker');

      ws.onopen = () => { statusEl.textContent = "CONECTADO A BINANCE LIVE"; };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        const currentPrice = parseFloat(data.c);
        const priceChangePercent = parseFloat(data.P);

        priceEl.textContent = currentPrice.toLocaleString('en-US', { style: 'currency', currency: 'USD' });
        changeEl.textContent = `${priceChangePercent >= 0 ? '+' : ''}${priceChangePercent.toFixed(2)}%`;
        changeEl.style.color = priceChangePercent >= 0 ? 'var(--accent-green)' : 'var(--accent-red)';

        if (lastPrice !== 0) {
          if (currentPrice > lastPrice) {
            tickerBox.classList.add('flash-up');
            setTimeout(() => tickerBox.classList.remove('flash-up'), 250);
          } else if (currentPrice < lastPrice) {
            tickerBox.classList.add('flash-down');
            setTimeout(() => tickerBox.classList.remove('flash-down'), 250);
          }
        }
        lastPrice = currentPrice;
      };

      ws.onerror = () => { statusEl.textContent = "ERROR CONEXIÓN PRECIO"; };
      ws.onclose = () => { setTimeout(initLiveBtcStream, 3000); };
    }

    // 2. CONVERSIÓN DE HORA A COSTA RICA
    function formatToCostaRicaTime(dateObj) {
      return new Intl.DateTimeFormat('es-CR', {
        timeZone: 'America/Costa_Rica',
        weekday: 'long',
        day: 'numeric',
        month: 'short',
        hour: '2-digit',
        minute: '2-digit',
        hour12: true
      }).format(dateObj);
    }

    // 3. DETERMINAR NIVEL DE IMPACTO AUTOMÁTICO BASADO EN EL TÍTULO O IMPACTO DE FMP
    function getImpactLevel(title, impactStr) {
      if (impactStr) {
        const imp = impactStr.toLowerCase();
        if (imp.includes('high') || imp.includes('alto')) return { text: '🔴 Alto', class: 'impact-high' };
        if (imp.includes('medium') || imp.includes('medio')) return { text: '🟡 Medio', class: 'impact-medium' };
        if (imp.includes('low') || imp.includes('bajo')) return { text: '🟢 Bajo', class: 'impact-low' };
      }

      const t = title.toUpperCase();
      if (t.includes('CPI') || t.includes('INFLATION') || t.includes('NFP') || t.includes('PAYROLL') || t.includes('FED') || t.includes('RATE') || t.includes('FOMC') || t.includes('DESEMPLEO')) {
        return { text: '🔴 Alto', class: 'impact-high' };
      } else if (t.includes('PPI') || t.includes('PMI') || t.includes('VENTAS') || t.includes('RETAIL') || t.includes('MICHIGAN')) {
        return { text: '🟡 Medio', class: 'impact-medium' };
      }
      return { text: '🟢 Bajo', class: 'impact-low' };
    }

    // 4. MOTOR DE EVALUACIÓN PONDERADO
    function processNewsCluster(cluster) {
      let usdImpactScore = 0;

      cluster.events.forEach(evt => {
        const actual = parseFloat(evt.actual);
        const forecast = parseFloat(evt.forecast);

        if (isNaN(actual) || isNaN(forecast)) return;
        const diff = actual - forecast;
        const title = (evt.title || '').toUpperCase();

        let weight = 1.0;
        if (evt.impactObj.class === 'impact-high') weight = 2.5;
        if (evt.impactObj.class === 'impact-medium') weight = 1.5;

        if (title.includes('CPI') || title.includes('INFLATION') || title.includes('PPI')) {
          usdImpactScore += diff * weight * 2.0;
        } else if (title.includes('PAYROLL') || title.includes('NFP')) {
          usdImpactScore += (diff / 50.0) * weight;
        } else if (title.includes('UNEMPLOYMENT') || title.includes('DESEMPLEO')) {
          usdImpactScore -= diff * weight * 2.0;
        } else if (title.includes('FED') || title.includes('RATE')) {
          usdImpactScore += diff * (weight * 1.5);
        } else {
          usdImpactScore += diff * weight * 0.1;
        }
      });

      if (usdImpactScore > 0.15) {
        return {
          direction: "BAJAR 📉",
          biasClass: "bearish",
          confidence: "88%",
          explanation: "Noticias de alto/medio impacto muestran un Dólar fuerte, presionando el precio de BTC a la baja."
        };
      } else if (usdImpactScore < -0.15) {
        return {
          direction: "SUBIR 📈",
          biasClass: "bullish",
          confidence: "91%",
          explanation: "Debilidad en el USD tras noticias clave incentiva la liquidez hacia Bitcoin."
        };
      } else {
        return {
          direction: "NEUTRAL ➔",
          biasClass: "neutral",
          confidence: "70%",
          explanation: "Impacto balanceado o datos dentro de estimaciones. Se espera volatilidad baja a moderada."
        };
      }
    }

    function renderClusterUI(cluster) {
      const container = document.getElementById('clusters-container');
      const result = processNewsCluster(cluster);

      const html = `
        <div class="cluster-box">
          <div class="cluster-header">
            <span style="text-transform: capitalize;">📅 ${cluster.formattedTimeCR} (Hora Costa Rica)</span>
            <span>Bloque de Noticias (${cluster.events.length} Eventos)</span>
          </div>
          ${cluster.events.map(e => {
            const cleanTitle = e.title.replace(/^us\s+/i, '');
            const formatVal = (val, unit) => {
              if (val === 'Pendiente' || val === '--' || val === undefined || val === null || val === '') return 'Pendiente';
              return `${val}${unit || ''}`;
            };

            return `
              <div class="news-item">
                <div><strong>🇺🇸 ${cleanTitle}</strong></div>
                <div><span class="impact-badge ${e.impactObj.class}">${e.impactObj.text}</span></div>
                <div class="val-field"><span>Anterior</span><strong>${formatVal(e.previous, e.unit)}</strong></div>
                <div class="val-field"><span>Pronóstico</span><strong>${formatVal(e.forecast, e.unit)}</strong></div>
                <div class="val-field"><span>Actual</span><strong style="color: var(--accent-blue);">${formatVal(e.actual, e.unit)}</strong></div>
              </div>
            `;
          }).join('')}
          <div class="ai-banner">
            <div>
              <span style="font-size: 0.75rem; color: var(--text-muted);">EFECTO PROYECTADO EN BITCOIN:</span>
              <p style="font-size: 0.85rem; margin-top: 4px; max-width: 700px;">${result.explanation}</p>
            </div>
            <div style="text-align: right;">
              <span class="signal-pill ${result.biasClass}">${result.direction}</span>
              <span style="display: block; font-size: 0.75rem; color: var(--text-muted); margin-top: 4px;">Confianza: ${result.confidence}</span>
            </div>
          </div>
        </div>
      `;
      container.innerHTML += html;
    }

    function loadFallbackCalendar() {
      const msgBox = document.getElementById('status-message');
      msgBox.innerHTML = '';
      const now = new Date();
      const monday = new Date(now.setDate(now.getDate() - (now.getDay() || 7) + 1));

      const fullWeekClusters = [
        {
          formattedTimeCR: formatToCostaRicaTime(new Date(monday.getFullYear(), monday.getMonth(), monday.getDate(), 9, 30)),
          events: [
            { title: 'Subasta de Bonos del Tesoro de EE.UU. (6 Meses)', impactObj: { text: '🟡 Medio', class: 'impact-medium' }, previous: '4.20', forecast: '4.18', actual: 'Pendiente', unit: '%' },
            { title: 'Expectativas de Inflación del Consumidor', impactObj: { text: '🔴 Alto', class: 'impact-high' }, previous: '3.1', forecast: '3.0', actual: 'Pendiente', unit: '%' }
          ]
        },
        {
          formattedTimeCR: formatToCostaRicaTime(new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 1, 6, 30)),
          events: [
            { title: 'Permisos de Construcción y Licencias', impactObj: { text: '🟢 Bajo', class: 'impact-low' }, previous: '1.47', forecast: '1.45', actual: 'Pendiente', unit: 'M' },
            { title: 'Índice de Precios de Importación (MoM)', impactObj: { text: '🟡 Medio', class: 'impact-medium' }, previous: '0.6', forecast: '0.2', actual: 'Pendiente', unit: '%' }
          ]
        },
        {
          formattedTimeCR: formatToCostaRicaTime(new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 2, 12, 0)),
          events: [
            { title: 'Publicación del Libro Beige de la FED', impactObj: { text: '🔴 Alto', class: 'impact-high' }, previous: '--', forecast: '--', actual: 'Pendiente', unit: '' }
          ]
        },
        {
          formattedTimeCR: formatToCostaRicaTime(new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 3, 6, 30)),
          events: [
            { title: 'Solicitudes Semanales de Subsidio por Desempleo', impactObj: { text: '🔴 Alto', class: 'impact-high' }, previous: '225', forecast: '220', actual: 'Pendiente', unit: 'K' },
            { title: 'Índice Manufacturero Fed de Filadelfia', impactObj: { text: '🟡 Medio', class: 'impact-medium' }, previous: '1.7', forecast: '3.0', actual: 'Pendiente', unit: 'Pts' }
          ]
        },
        {
          formattedTimeCR: formatToCostaRicaTime(new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 4, 7, 45)),
          events: [
            { title: 'PMI del Sector Servicios de S&P Global', impactObj: { text: '🟡 Medio', class: 'impact-medium' }, previous: '55.2', forecast: '55.0', actual: 'Pendiente', unit: 'Pts' },
            { title: 'Confianza del Consumidor de Michigan', impactObj: { text: '🔴 Alto', class: 'impact-high' }, previous: '68.9', forecast: '69.0', actual: 'Pendiente', unit: 'Pts' }
          ]
        }
      ];

      fullWeekClusters.forEach(cluster => renderClusterUI(cluster));
    }

    // 5. CARGA DE CALENDARIO DESDE FMP API
    async function fetchWeeklyCalendar() {
      const msgBox = document.getElementById('status-message');
      const container = document.getElementById('clusters-container');
      msgBox.innerHTML = '<div class="info-msg">⏳ Sincronizando eventos y datos actuales vía Financial Modeling Prep (FMP)...</div>';
      container.innerHTML = '';

      try {
        const url = `https://financialmodelingprep.com/api/v3/economic_calendar?apikey=${FMP_API_KEY}`;
        const res = await fetch(url, { cache: 'no-store' });

        if (res.ok) {
          const data = await res.json();
          // Filtrar eventos correspondientes a Estados Unidos
          const usdEvents = data.filter(e => e.country === 'US');

          if (usdEvents && usdEvents.length > 0) {
            msgBox.innerHTML = '';
            const clustersMap = {};

            usdEvents.forEach(evt => {
              const eventDate = evt.date ? new Date(evt.date) : new Date();
              const formattedCR = formatToCostaRicaTime(eventDate);

              if (!clustersMap[formattedCR]) {
                clustersMap[formattedCR] = { formattedTimeCR: formattedCR, events: [] };
              }

              const title = evt.event || 'Evento Económico';
              clustersMap[formattedCR].events.push({
                title: title,
                impactObj: getImpactLevel(title, evt.impact),
                previous: evt.previous !== null ? evt.previous : '--',
                forecast: evt.estimate !== null ? evt.estimate : '--',
                actual: evt.actual !== null && evt.actual !== undefined ? evt.actual : 'Pendiente',
                unit: ''
              });
            });

            Object.values(clustersMap).forEach(cluster => renderClusterUI(cluster));
            return;
          }
        }
      } catch (e) {
        console.warn("Error al conectar con FMP. Activando plantilla de respaldo.", e);
      }

      loadFallbackCalendar();
    }

    // Inicialización
    initLiveBtcStream();
    fetchWeeklyCalendar();
    setInterval(fetchWeeklyCalendar, 60000);
  </script>
</body>
</html>
